name: Deploy

# Deploys the testnet Worker after CI passes on a push to main, or when started by hand on main.
# workflow_run keeps CI to one run per push. The job checks out the exact commit that CI tested.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy halfway through a migration. A newer deploy waits for the running one.
concurrency:
  group: deploy-testnet
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    # A pull request from a fork can have a branch named main, so also check the event and the repository.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testnet
    # The token reaches only the steps that call Cloudflare, never the dependency install.
    steps:
      - name: Check for Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in the testnet environment. Nothing was deployed. See docs/RUNBOOK.md, First deploy."
            echo "present=false" >>"$GITHUB_OUTPUT"
          else
            echo "present=true" >>"$GITHUB_OUTPUT"
          fi

      - if: steps.credentials.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - if: steps.credentials.outputs.present == 'true'
        uses: ./.github/actions/setup

      - name: Refuse anything but testnet
        if: steps.credentials.outputs.present == 'true'
        run: node .github/scripts/assert-testnet.mjs wrangler.jsonc

      - name: Build the dashboard
        if: steps.credentials.outputs.present == 'true'
        run: pnpm run build:dashboard

      - name: Apply D1 migrations
        if: steps.credentials.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply corridor-weather --remote --config wrangler.jsonc

      - name: Deploy the Worker
        if: steps.credentials.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.jsonc
